# === Global params ============================================================
# Deux groupes distincts : IFX (Insert FX, partagé entre parts qui ont
# un Send>0) et Master FX (en bout de chaîne).
# Les deux groupes utilisent le même preface NRPN (data_msb=16, "Common"
# zone Korg). Stay redundant — pas de factorisation pour 2 lignes
# de gain (cf. arbitrage chef d'orchestre).

global_param_groups:
  - id: "ifx"
    label: "Insert FX"
    addressing:
      midi_channel: 1
      preface:
        - { mechanism: "nrpn", msb: 0, lsb: 1, data_msb: 16 }
    params:
      - { name: "Type",   mechanism: "cc", cc: 80, curve: "none", type: "enum",
          values: ["Off", "Reverb", "Delay", "Chorus", "Flanger", "Phaser",
                   "Distortion", "Decimator", "FilterLFO", "WahAuto", "Compressor",
                   "Tube", "Grain", "PitchShifter", "Looper", "Tape", "Vocoder"] }
      - { name: "Param1", mechanism: "cc", cc: 81, curve: "linear", type: "continuous" }
      - { name: "Param2", mechanism: "cc", cc: 82, curve: "linear", type: "continuous" }
      - { name: "Param3", mechanism: "cc", cc: 83, curve: "linear", type: "continuous" }
      - { name: "Mix",    mechanism: "cc", cc: 84, curve: "exp",    type: "continuous" }

  - id: "mfx"
    label: "Master FX"
    addressing:
      midi_channel: 1
      preface:
        - { mechanism: "nrpn", msb: 0, lsb: 1, data_msb: 16 }
    params:
      - { name: "Type",   mechanism: "cc", cc: 85, curve: "none", type: "enum",
          values: ["Off", "Compressor", "Limiter", "EQ", "Saturator", "Maximizer"] }
      - { name: "Param1", mechanism: "cc", cc: 86, curve: "linear", type: "continuous" }
      - { name: "Param2", mechanism: "cc", cc: 87, curve: "linear", type: "continuous" }
      - { name: "Param3", mechanism: "cc", cc: 88, curve: "linear", type: "continuous" }
      - { name: "Mix",    mechanism: "cc", cc: 89, curve: "exp",    type: "continuous" }

quirks:
  requires_part_select_preface: true
